services:
  mysql:
    image: ${IMAGE_BASE:?IMAGE_BASE is required}-mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: ${IMAGE_BASE:?IMAGE_BASE is required}-redis:7-alpine
    restart: unless-stopped
    command: ["--appendonly", "yes"]   # AOF 持久化，重启不丢缓存，避免冷启动击穿 DB
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DBNAME: ${MYSQL_DATABASE:-blog}
      MYSQL_CHARSET: utf8mb4
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      # 上传目录：简历 PDF 落在这里。必须挂 volume，否则每次发版容器重建就丢文件
      UPLOAD_DIR: /data/uploads
    volumes:
      - upload-data:/data/uploads
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    healthcheck:
      # alpine 里只有 busybox wget、没有 curl；healthz 会顺带 ping DB，DB 也正常才算 healthy
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s   # 首启要跑 AutoMigrate+seed，给足启动时间

volumes:
  mysql-data:
  redis-data:
  upload-data:
