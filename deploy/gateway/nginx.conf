# 网关 nginx —— 统一入口，对外 80。
# 职责：/ 转发到前端容器(:8081)，/api 转发到后端容器(:8080)。
# 前后端容器都绑在宿主机 127.0.0.1，本网关用 host 网络才能访问到它们。
server {
    listen 80;
    server_name _;

    # 压缩：gzip_proxied any 才会压缩来自上游（前端静态资源 / 后端 JSON）的响应。
    # 静态资源本身在前端容器那一层已开 gzip 并带强缓存，这里主要收益是 API 的 JSON。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

    # 网关自身健康检查（不依赖上游），部署脚本用它确认网关起来了
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "gateway ok\n";
    }

    # 后端 API：保留 /api/v1 前缀原样转发（前端 apiBaseUrl=/api/v1）
    # proxy_pass 不带尾部路径 → 保留原始 URI，后端拿到的仍是 /api/v1/xxx
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 其余全部给前端（前端容器内部自带 SPA try_files 兜底）
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
